<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدواتي</title>
    <!-- ربط ملف الإعدادات -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b2b2b">
    <style>
        body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #2b2b2b; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 90%; width: 350px; }
        h1 { margin-top: 0; color: #4CAF50; }
        
        /* تصميم زر التثبيت (مخفي افتراضياً) */
        #installAppBtn { display: none; background: #4CAF50; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%; transition: background 0.3s; }
        #installAppBtn:hover { background: #45a049; }
    </style>
</head>
<body>

    <div class="card">
        <h1>أدواتي 🚀</h1>
        <p>أهلاً بك في تطبيقك الخاص.</p>
        
        <!-- هذا الزر سيظهر تلقائياً عندما يتأكد المتصفح أن التطبيق جاهز -->
        <button id="installAppBtn">تثبيت التطبيق على الهاتف</button>
    </div>

    <script>
        // 1. تسجيل ملف Service Worker (مهم جداً لكي يقبل الهاتف تثبيت التطبيق)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('تم تسجيل ملف sw.js بنجاح'))
                    .catch(err => console.error('فشل تسجيل ملف sw.js', err));
            });
        }

        // 2. كود إظهار زر التثبيت
        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');

        // التقاط حدث التثبيت من المتصفح
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // منع ظهور الإشعار الصغير الافتراضي
            deferredPrompt = e; // حفظ الحدث
            installAppBtn.style.display = 'block'; // إظهار زر التثبيت الخاص بنا
        });

        // تنفيذ التثبيت عند الضغط على الزر
        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // إظهار نافذة التثبيت الرسمية من النظام
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`نتيجة التثبيت: ${outcome}`);
                deferredPrompt = null; // تفريغ الحدث
                installAppBtn.style.display = 'none'; // إخفاء الزر بعد الضغط
            }
        });

        // إخفاء الزر نهائياً إذا تم التثبيت مسبقاً
        window.addEventListener('appinstalled', () => {
            installAppBtn.style.display = 'none';
            console.log('التطبيق مثبت بالفعل على جهازك');
        });
    </script>
</body>
</html>
