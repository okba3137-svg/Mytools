<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدواتي</title>
    <!-- 1. ربط ملف الإعدادات -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b2b2b"/>
    <style>
        body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a1a; color: white; }
        .card { background: #2b2b2b; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>تطبيقي الأول 🚀</h1>
        <h2 id="clock" style="color: #4CAF50; font-size: 2.5rem; margin: 10px 0;">00:00:00</h2>
        <button onclick="alert('التطبيق يعمل بكفاءة، حتى بدون إنترنت!')">اختبر التفاعل</button>
    </div>

    <script>
        // ساعة رقمية بسيطة
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-SA');
        }, 1000);

        // 2. تفعيل العمل بدون إنترنت (Service Worker)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
